<div class="tv-login-container">
  <div class="tv-login-card">
    <img src="assets/brand/logo.png" alt="LAGUN" class="tv-login-logo" />
    <h2>Iniciar Sesión en LAGUN TV</h2>

    <div *ngIf="errorMsg" class="login-error-msg">
      ⚠️ {{ errorMsg }}
    </div>

    <form (ngSubmit)="submit()" class="tv-login-form">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input #emailInput type="email" [(ngModel)]="email" name="email" class="tv-input"
          [class.focused]="focusedInput === 'email'" (focus)="focusedInput = 'email'" placeholder="correo@ejemplo.com"
          required autofocus />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input #passwordInput type="password" [(ngModel)]="password" name="password" class="tv-input"
          [class.focused]="focusedInput === 'password'" (focus)="focusedInput = 'password'" placeholder="••••••••"
          required />
      </div>

      <button #submitBtn type="submit" class="tv-submit-btn" [class.focused]="focusedInput === 'submit'"
        (focus)="focusedInput = 'submit'" [disabled]="loading">
        {{ loading ? 'Iniciando...' : 'Entrar' }}
      </button>

      <div class="tv-actions-row">
        <p class="tv-link-text">
          ¿No tienes cuenta?
          <a #registerBtn routerLink="/tv/register" class="tv-link" [class.focused]="focusedInput === 'register'"
            (focus)="focusedInput = 'register'">Regístrate</a>
        </p>

        <button #backBtn type="button" (click)="goBack()" class="tv-back-btn" [class.focused]="focusedInput === 'back'"
          (focus)="focusedInput = 'back'">
          ← Volver
        </button>
      </div>
    </form>
  </div>
</div>
