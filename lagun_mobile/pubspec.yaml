name: lagun_mobile
description: "App móvil principal de noticias LAGUN."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.36.8
  permission_handler: ^11.4.0
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/icono.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - .env